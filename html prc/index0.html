<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>product table</title>
</head>
<body>
    <h1>product table</h1>
    <br>
    <table border="1">
        <thead>
            <tr>
            <th>product name</th>
            <th>price</th>
            <th>quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>bat</td>
                <td>30</td>
                <td>2</td>
            </tr>
            <tr>
                <td>book</td>
                <td>50</td>
                <td>5</td>
            </tr>
         </tbody>
         <tfoot>
            <tr>
                <td colspan="2">total amount =</td>
                    <td>310</td>
                </tr>
         </tfoot>

    </table>
</body>
</html>
