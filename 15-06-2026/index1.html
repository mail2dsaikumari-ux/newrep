<!-- Build a URL shortener UI using React Hooks, API calls, async/await, and responsive CSS. -->

<!DOCTYPE html>
<html>
<head>
  <title>URL Shortener UI</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      background:white;
      width:400px;
      padding:30px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:10px;
      box-sizing:border-box;
      margin-bottom:15px;
    }

    button{
      padding:10px 20px;
      background:blue;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    #result{
      margin-top:20px;
      word-wrap:break-word;
      color:green;
      font-weight:bold;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <h1>URL Shortener</h1>

    <input
      type="text"
      id="urlInput"
      placeholder="Enter URL"
    >

    <button onclick="shortenURL()">

      Shorten URL

    </button>

    <div id="result">

    </div>

  </main>

  <script>

    // Async Function
    async function shortenURL(){

      let longURL =
      document.getElementById(
      "urlInput"
      ).value;

      let result =
      document.getElementById(
      "result"
      );

      try{

        // API Call
        let response =
        await fetch(
        `https://tinyurl.com/api-create.php?url=${longURL}`
        );

        let shortURL =
        await response.text();

        result.innerHTML =

        "Short URL:<br>" +
        shortURL;

      }

      catch(error){

        result.innerHTML =
        "Error Generating URL";

      }

    }

  </script>

</body>
</html>
