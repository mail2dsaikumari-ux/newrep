<!DOCTYPE html>
<html>
<body>

<h2>OOP Example</h2>
<p id="output"></p>

<script>
class Student {
  constructor(name, age) {
    this.name = name;
    this.age = age;
  }

  display() {
    return "Name: " + this.name + "<br>Age: " + this.age;
  }
}

let s1 = new Student("Sai", 25);

document.getElementById("output").innerHTML = s1.display();
</script>

</body>
</html>
