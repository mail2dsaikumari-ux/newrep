
<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <style>
        .pricing-container {
            display: flex;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            width: 250px;
            text-align: center;
            border-radius: 10px;
         
            transition: all 0.4s ease;
        }                                          
        .card:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="pricing-container">

    <div class="card">
        <h2>Basic</h2>
        <div class="price">$10/month</div>
        <ul>
            <li>5 Projects</li>
            <li>5 GB Storage</li>
            <li>Email Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card featured">
        <h2>Standard</h2>
        <div class="price">$20/month</div>
        <ul>
            <li>20 Projects</li>
            <li>15 GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <div class="price">$30/month</div>
        <ul>
            <li>Unlimited Projects</li>
            <li>50 GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

</div>

</body>
</html>
