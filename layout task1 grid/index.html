<!DOCTYPE html>
<html>
<head>
  <title>Grid Task</title>
  <link rel="stylesheet" href="style.css">
<style>body {
  background: #f2f2f2;
  font-family: Arial, sans-serif;
}

/* main grid area */
.grid-container {
  width: 800px;
  margin: 20px auto;
  background: #2fb6a3;   /* green background */
  padding: 15px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 150px;
  gap: 15px;
}

/* common box style */
.box {
  background: #cfa2a2;
  padding: 10px;
  font-weight: bold;
}

/* box sizes */
.box1 {
  grid-column: 1 / 3;   /* wide box */
}

.box2 {
  grid-column: 3 / 4;
}

.box3 {
  grid-row: span 2;    /* tall box */
}

.box4 {
  grid-column: 2 / 4;  /* wide box */
}

.box6 {
  grid-column: 2 / 4;  /* bottom wide box */
}</style>

</head>
<body>

<div class="grid-container">
  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
  <div class="box box3">Box 3</div>
  <div class="box box4">Box 4</div>
  <div class="box box5">Box 5</div>
  <div class="box box6">Box 6</div>
</div>

</body>
</html>
