<!DOCTYPE html>
<html>
<head>
  <title>Browser APIs Output</title>
</head>
<body>

<h2>Browser APIs</h2>

<script>

// setTimeout → runs once after 2 seconds
setTimeout(() => {
  console.log("setTimeout: runs once after 2 seconds");
}, 2000);


// setInterval → runs every 1 second
let intervalId = setInterval(() => {
  console.log("setInterval: runs every 1 second");
}, 1000);


// clearInterval → stop after 5 seconds
setTimeout(() => {
  clearInterval(intervalId);
  console.log("clearInterval: interval stopped");
}, 5000);

</script>

</body>
</html>
