<!-- Build a quiz app using React state management, JavaScript array methods, CSS Flexbox, and semantic HTML. -->
<!DOCTYPE html>
<html>
<head>
  <title>Quiz App</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    /* Container */
    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Quiz Box */
    .quiz-box{
      background:white;
      padding:30px;
      width:400px;
      border-radius:10px;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      text-align:center;
    }

    /* Flexbox */
    .options{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:20px;
    }

    button{
      padding:10px;
      border:none;
      background:blue;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

    button:hover{
      background:#0077ff;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <section class="quiz-box">

      <h1>Quiz App</h1>

      <!-- Question -->
      <h2 id="question"></h2>

      <!-- Options -->
      <article class="options" id="options">

      </article>

      <!-- Score -->
      <h3 id="score"></h3>

    </section>

  </main>

  <script>

    // Questions Array
    let quiz = [

      {
        question:"HTML stands for?",
        options:[
          "Hyper Text Markup Language",
          "High Text Machine Language",
          "Hyper Transfer Language"
        ],
        answer:
        "Hyper Text Markup Language"
      },

      {
        question:"CSS used for?",
        options:[
          "Styling",
          "Database",
          "Backend"
        ],
        answer:"Styling"
      },

{
  question:"JavaScript is used for?",
  options:[
    "Website Functionality",
    "Database",
    "Server Hardware"
  ],
  answer:"Website Functionality"
},

{
  question:"React is used for?",
  options:[
    "Building UI",
    "Database",
    "Styling"
  ],
  answer:"Building UI"
}
    ];

    // Variables
    let current = 0;
    let score = 0;

    // Elements
    let question =
    document.getElementById("question");

    let options =
    document.getElementById("options");

    // Load Question
    function loadQuiz(){

      let q = quiz[current];

      question.innerText =
      q.question;

      options.innerHTML = "";

      // map()
      q.options.map(function(option){

        options.innerHTML += `

          <button
          onclick="checkAnswer('${option}')">

            ${option}

          </button>

        `;

      });

    }

    // Check Answer
    function checkAnswer(option){

      if(option === quiz[current].answer){

        score++;

      }

      current++;

      // Next Question
      if(current < quiz.length){

        loadQuiz();

      }else{

        document.querySelector(".quiz-box")
        .innerHTML = `

          <h1>Quiz Finished</h1>

          <h2>
            Score : ${score}/${quiz.length}
          </h2>

        `;
      }

    }

    // First Load
    loadQuiz();

  </script>

</body>
</html>
