<!-- Build an e-commerce product card using React props, CSS animations, JavaScript events, and semantic HTML tags.  -->

<!DOCTYPE html>
<html>
<head>
  <title>Product Card</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    /* Container */
    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Product Card */
    .card{
      width:300px;
      background:white;
      padding:20px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;

      /* Animation */
      transition:0.3s;
    }

    /* Hover Effect */
    .card:hover{
      transform:scale(1.05);
    }

    /* Image */
    img{
      width:100%;
      height:200px;
      border-radius:10px;
      object-fit:cover;
    }

    /* Price */
    p{
      color:gray;
      font-size:20px;
    }

    /* Button */
    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <article class="card">

      <!-- Product Image -->
      <img
        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
        alt="Wireless Headphones"
      >

      <!-- Product Name -->
      <h2>
        Wireless Headphones
      </h2>

      <!-- Product Price -->
      <p>
        ₹1999
      </p>

      <!-- Button -->
      <button onclick="addToCart()">
        Add to Cart
      </button>

    </article>

  </main>

  <script>

    // JavaScript Event
    function addToCart(){

      alert(
        "Wireless Headphones Added to Cart"
      );

    }

  </script>

</body>
</html>
