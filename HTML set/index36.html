<!-- Build a recipe finder app using React Hooks, API fetching, JavaScript async/await, and responsive CSS Grid. -->

<!DOCTYPE html>
<html>
<head>
  <title>Recipe Finder</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    /* Container */

   .container{
  width:400px;
  margin:auto;
  margin-top:30px;
  padding:20px;
  background:white;
  border-radius:10px;
  box-shadow:0px 0px 10px gray;
}
    

    h1{
      text-align:center;
    }

    input{
      width:100%;
      padding:10px;
      box-sizing:border-box;
      margin-bottom:15px;
    }

    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    /* CSS Grid */
    .recipes{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(250px,1fr));

      gap:20px;
      margin-top:20px;
    }

    /* Recipe Card */
    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0px 0px 10px gray;
      text-align:center;
    }

    /* Recipe Image */

    img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <h1>Recipe Finder</h1>

    <!-- Input -->
    <input
      type="text"
      id="recipeInput"
      placeholder="Enter Recipe Name"
    >

    <!-- Button -->
    <button onclick="getRecipes()">
      Search Recipe
    </button>

    <!-- Recipes -->
    <section class="recipes"
    id="recipes">

    </section>

  </main>

  <script>

    // Async Function
    async function getRecipes(){

      // Input Value
      let recipe =
      document.getElementById("recipeInput")
      .value;

      // API URL
      let url =
      `https://www.themealdb.com/api/json/v1/1/search.php?s=${recipe}`;

      // Fetch API
      let response =
      await fetch(url);

      // JSON Data
      let data =
      await response.json();

      // Recipes Container
      let recipesDiv =
      document.getElementById("recipes");

      recipesDiv.innerHTML = "";

      // Display Recipes
      data.meals.map(function(meal){

        recipesDiv.innerHTML += `

          <article class="card">

            <img
            src="${meal.strMealThumb}">

            <h3>${meal.strMeal}</h3>

          </article>

        `;

      });

    }

  </script>

</body>
</html>
