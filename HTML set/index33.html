<!-- Create a counter app using React Hooks, JavaScript events, CSS transitions, and responsive layout. -->

<!DOCTYPE html>
<html>
<head>
  <title>Counter App</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    /* Container */
    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Counter Box */
    .counter-box{
      background:white;
      padding:30px;
      width:300px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    /* Count */
    #count{
      font-size:40px;
      margin-bottom:20px;

      /* Transition */
      transition:0.3s;
    }

    button{
      padding:10px 20px;
      margin:5px;
      border:none;
      background:blue;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

    /* Responsive */
    @media(max-width:500px){

      .counter-box{
        width:90%;
      }

    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <section class="counter-box">

      <h1>Counter App</h1>

      <!-- Count -->
      <article id="count">
        0
      </article>

      <!-- Buttons -->
      <button onclick="increase()">
        Increase
      </button>

      <button onclick="decrease()">
        Decrease
      </button>
      <button onclick="resetCount()">
        Reset
      </button>
    </section>
  </main>
  <script>
    // Count Variable
    let count = 0;
    // Increase
    function increase(){

      count++;
      document.getElementById("count")
      .innerText = count;

    }

    // Decrease
    function decrease(){

      count--;

      document.getElementById("count")
      .innerText = count;

    }

    // Reset
    function resetCount(){

      count = 0;

      document.getElementById("count")
      .innerText = count;

    }

  </script>

</body>
</html>
