<!-- Layout (header, content, footer)
Margin & border
Margin collapse
Box-sizing -->

<!DOCTYPE html>
<html>
<head>
    <title>Chapter 3</title>

    <style>
        body {
            margin: 0;
        }

        /* Header */
        .header {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Content */
        .content {
            background-color: lightgray;
            margin: 20px;
            padding: 20px;
            border: 5px solid black;

            /* Try commenting this to see difference */
            box-sizing: border-box;
        }

        /* Footer */
        .footer {
            background-color: black;
            color: white;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
    </style>

</head>
<body>

    <div class="header">
        Header
    </div>

    <div class="content">
        Content Box
    </div>

    <div class="footer">
        Footer
    </div>

</body>
</html>
