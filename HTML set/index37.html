<!-- Create a currency converter using React state, JavaScript calculations, API fetching, and semantic HTML. -->

<!DOCTYPE html>
<html>
<head>
  <title>Currency Converter</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    /* Container */
    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Box */
    .box{
      background:white;
      padding:30px;
      width:320px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    label{
      display:block;
      text-align:left;
      margin-top:10px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      box-sizing:border-box;
    }

    select{
      width:100%;
      padding:10px;
      margin-top:10px;
      box-sizing:border-box;
    }

    button{
      padding:10px 20px;
      margin-top:20px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    #result{
      margin-top:20px;
      font-size:20px;
      color:green;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <section class="box">

      <h1>Currency Converter</h1>

      <!-- Amount -->
      <label>
        Enter Amount
      </label>

      <input
        type="number"
        id="amount"
        placeholder="Enter Amount"
      >

      <!-- From Country -->
      <label>
        From Country
      </label>

      <select id="from">

        <option value="USD">
          USA - Dollar
        </option>

        <option value="INR">
          India - Rupee
        </option>

      </select>

      <!-- To Country -->
      <label>
        To Country
      </label>

      <select id="to">

        <option value="INR">
          India - Rupee
        </option>

        <option value="USD">
          USA - Dollar
        </option>

      </select>

      <!-- Button -->
      <button onclick="convertCurrency()">
        Convert
      </button>

      <!-- Result -->
      <article id="result">

      </article>

    </section>

  </main>

  <script>

    // Convert Currency
    async function convertCurrency(){

      // Amount
      let amount =
      document.getElementById("amount")
      .value;

      // From Currency
      let from =
      document.getElementById("from")
      .value;

      // To Currency
      let to =
      document.getElementById("to")
      .value;

      // API URL
      let url =
      `https://api.exchangerate-api.com/v4/latest/${from}`;

      // Fetch API
      let response =
      await fetch(url);

      // JSON Data
      let data =
      await response.json();

      // Currency Rate
      let rate =
      data.rates[to];

      // Final Calculation
      let result =
      amount * rate;

      // Display Result
      document.getElementById("result")
      .innerText =
      "Converted Amount : " +
      result.toFixed(2);

    }

  </script>

</body>
</html>
