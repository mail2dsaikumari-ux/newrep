<!-- Build a movie search app using React Hooks, API integration, JavaScript promises, and responsive CSS cards. -->

<!DOCTYPE html>
<html>
<head>
  <title>Movie Search App</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    .container{
      padding:20px;
      text-align:center;
    }

    h1{
      margin-bottom:20px;
    }

    input{
      width:300px;
      padding:10px;
    }

    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
      margin-left:10px;
    }

    /* Movie Cards */
    .movies{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
      margin-top:20px;
    }

    /* Card */
    .card{
      width:200px;
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0px 0px 10px gray;
    }

    img{
      width:100%;
      height:250px;
      object-fit:cover;
      border-radius:10px;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <h1>Movie Search App</h1>

    <!-- Input -->
    <input
      type="text"
      id="movieInput"
      placeholder="Enter Movie Name"
    >

    <!-- Button -->
    <button onclick="searchMovies()">
      Search
    </button>

    <!-- Movies -->
    <section
      class="movies"
      id="movies">

    </section>

  </main>

  <script>

    // Search Function
    function searchMovies(){

      // Movie Name
      let movie =
      document.getElementById("movieInput")
      .value;

      // API URL
      let url =
      `https://www.omdbapi.com/?s=${movie}&apikey=207b2978`;

      // Fetch API
      fetch(url)

      .then(function(response){

        return response.json();

      })

      .then(function(data){

        // Movies Container
        let moviesDiv =
        document.getElementById("movies");

        moviesDiv.innerHTML = "";

        // Check Movies
        if(data.Search){

          // Display Movies
          data.Search.map(function(movie){

            moviesDiv.innerHTML += `

              <article class="card">

                <img
                src="${movie.Poster}">

                <h3>
                  ${movie.Title}
                </h3>

                <p>
                  ${movie.Year}
                </p>

              </article>

            `;

          });

        }

        else{

          moviesDiv.innerHTML =
          "<h2>Movie Not Found</h2>";

        }

      });

    }

  </script>

</body>
</html>
