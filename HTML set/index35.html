<!-- Create a countdown timer using React Hooks, JavaScript intervals, CSS styling, and semantic HTML -->

<!DOCTYPE html>
<html>
<head>
  <title>Countdown Timer</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Timer Box */
    .timer-box{
      background:white;
      padding:30px;
      width:300px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:10px;
      box-sizing:border-box;
      margin-bottom:15px;
    }

    #timer{
      font-size:40px;
      margin-top:20px;
      color:blue;
    }

    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main>

    <section class="timer-box">

      <h1>Countdown Timer</h1>

      <!-- Input -->
      <input
        type="number"
        id="seconds"
        placeholder="Enter Seconds"
      >

      <!-- Button -->
      <button onclick="startTimer()">
        Start Timer
      </button>

      <!-- Timer -->
      <article id="timer">
        0
      </article>

    </section>

  </main>

  <script>

    // Timer Function
    function startTimer(){

      // Input Value
      let time =
      document.getElementById("seconds")
      .value;

      // Display
      let timer =
      document.getElementById("timer");

      timer.innerText = time;

      // Interval
      let count =
      setInterval(function(){

        time--;

        timer.innerText = time;

        // Stop Timer
        if(time <= 0){

          clearInterval(count);

          timer.innerText =
          "Time Over";

        }

      },1000);

    }

  </script>

</body>
</html>
