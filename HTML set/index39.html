 <!-- Create a typing speed tester using React state, JavaScript timers, CSS animations, and semantic HTML tags. -->

 <!DOCTYPE html>
<html>
<head>
  <title>Typing Speed Tester</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Box */
    .box{
      background:white;
      padding:30px;
      width:400px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    /* Paragraph */
    #text{
      font-size:18px;
      margin-bottom:20px;
    }

    textarea{
      width:100%;
      height:100px;
      padding:10px;
      box-sizing:border-box;
    }

    button{
      padding:10px 20px;
      margin-top:15px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    #result{
      margin-top:20px;
      font-size:20px;
      color:green;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <section class="box">

      <h1>Typing Speed Tester</h1>

      <!-- Text -->
      <article id="text">

        React makes web development easier.

      </article>

      <!-- Input -->
      <textarea
        id="input"
        placeholder="Start Typing Here">
      </textarea>

      <!-- Button -->
      <button onclick="checkSpeed()">
        Check Speed
      </button>

      <!-- Result -->
      <article id="result">

      </article>

    </section>

  </main>

  <script>

    // Start Time
    let startTime =
    new Date().getTime();

    // Check Speed
    function checkSpeed(){

      // End Time
      let endTime =
      new Date().getTime();

      // Total Time
      let totalTime =
      (endTime - startTime) / 1000;

      // Typed Text
      let typedText =
      document.getElementById("input")
      .value;

      // Word Count
      let words =
      typedText.split(" ").length;

      // Speed
      let speed =
      Math.round(
        (words / totalTime) * 60
      );

      // Display Result
      document.getElementById("result")
      .innerText =
      "Typing Speed : " +
      speed +
      " WPM";

    }

  </script>

</body>
</html>
