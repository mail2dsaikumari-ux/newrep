<!-- Build a music player using React state, JavaScript audio controls,and semantic HTML structure. -->

<!DOCTYPE html>
<html>
<head>
  <title>Music Player</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Player Box */
    .player{
      background:white;
      padding:30px;
      width:300px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      margin-bottom:20px;
    }

    img{
      width:200px;
      height:200px;
      border-radius:10px;
      margin-bottom:20px;
    }

    button{
      padding:10px 20px;
      margin:5px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main>

    <section class="player">

      <h1>Music Player</h1>

      <!-- Image -->
      <img
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f"
      >

      <!-- Song Name -->
      <h2>Sample Song</h2>

      <!-- Audio -->
      <audio id="song">

        <source
        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
        type="audio/mp3">

      </audio>

      <!-- Buttons -->
      <article>

        <button onclick="playMusic()">
          Play
        </button>

        <button onclick="pauseMusic()">
          Pause
        </button>

      </article>

    </section>

  </main>

  <script>

    // Audio Element
    let song =
    document.getElementById("song");

    // Play Music
    function playMusic(){

      song.play();

    }

    // Pause Music
    function pauseMusic(){

      song.pause();

    }

  </script>

</body>
</html>
