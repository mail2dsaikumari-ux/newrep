<!-- Create a Dark/Light Mode Toggle using JavaScript Local Storage and CSS Variables. -->

<!DOCTYPE html>
<html>
<head>
  <title>Dark Light Mode</title>

  <style>

    /* Light Theme */
    :root{
      --bg-color:white;
      --text-color:black;
      --box-color:#f2f2f2;
    }

    /* Dark Theme */
    .dark{
      --bg-color:black;
      --text-color:white;
      --box-color:#333;
    }

    body{
      margin:0;
      font-family:Arial;
      background:var(--bg-color);
      color:var(--text-color);

      /* CSS Transition */
      transition:0.3s;
    }

    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:var(--box-color);
      padding:30px;
      width:300px;
      border-radius:10px;
      text-align:center;
    }

    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

  </style>
</head>

<body>

  <main class="container">

    <section class="box">

      <h1 id="title">
        Light Mode
      </h1>

      <p>
        Click button to change theme
      </p>

      <button onclick="toggleMode()">
        Toggle Mode
      </button>

    </section>

  </main>

  <script>

    // Get Saved Theme
    let savedTheme = localStorage.getItem("theme");

    // Apply Dark Theme
    if(savedTheme === "dark"){
      document.body.classList.add("dark");
      document.getElementById("title").innerText = "Dark Mode";
    }

    // Toggle Function
    function toggleMode(){

      document.body.classList.toggle("dark");

      // Check Theme
      if(document.body.classList.contains("dark")){

        document.getElementById("title").innerText = "Dark Mode";

        localStorage.setItem("theme","dark");

      }else{

        document.getElementById("title").innerText = "Light Mode";

        localStorage.setItem("theme","light");
      }
    }

  </script>

</body>
</html>
