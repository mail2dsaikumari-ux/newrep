<!-- Create a real-time search suggestion app using React Hooks, JavaScript debounce, API fetching, and CSS styling. -->

<!-- A Real-Time Search Suggestion App displays matching suggestions while the user types in a search box. 
Debouncing is used to improve performance by reducing unnecessary searches, and the results update
dynamically based on the entered text. -->

<!DOCTYPE html>
<html>
<head>
  <title>Search Suggestion App</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      padding:20px;
    }

    .container{
      max-width:500px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:blue;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
      font-size:16px;
    }

    .card{
      background:white;
      padding:12px;
      margin-top:8px;
      border-radius:5px;
      box-shadow:0px 0px 5px lightgray;
      cursor:pointer;
    }

    .card:hover{
      background:#e6f2ff;
    }

  </style>

</head>

<body>

  <main class="container">

    <h1>Search Technology</h1>

    <input
      type="text"
      id="search"
      placeholder="Search Here..."
      onkeyup="debounceSearch()"
    >

    <section id="results">

    </section>

  </main>

  <script>

    let technologies = [

      "HTML",
      "CSS",
      "JavaScript",
      "React",
      "Redux",
      "Node JS",
      "Git",
      "GitHub",
     

    ];

    let timer;

    // Debounce

    function debounceSearch(){

      clearTimeout(timer);

      timer =
      setTimeout(function(){

        searchTechnology();

      },500);

    }

    // Search Technology

    function searchTechnology(){

      let value =
      document.getElementById(
      "search"
      ).value.toLowerCase();

      let results =
      document.getElementById(
      "results"
      );

      results.innerHTML = "";

      if(value === ""){

        return;

      }

      let filteredTechnology =
      technologies.filter(function(item){

        return item
        .toLowerCase()
        .includes(value);

      });

      filteredTechnology.forEach(function(item){

        results.innerHTML += `

        <div class="card">

          ${item}

        </div>

        `;

      });

    }

  </script>

</body>
</html>
