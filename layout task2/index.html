<!DOCTYPE html>
<html>
<head>
  <title>Multiple Layout Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== LAYOUT 1 ===== -->
<div class="container">
  <div class="box">Logo</div>
  <div class="box">Navigation</div>
  <div class="box header">Header / Banner</div>

  <div class="two-col">
    <div class="box">Side Bar</div>
    <div class="box">Body Area</div>
  </div>

  <div class="box">Footer</div>
</div>

<!-- ===== LAYOUT 2 ===== -->
<div class="container">
  <div class="top">
    <div class="box">Logo</div>
    <div class="box">Navigation</div>
  </div>

  <div class="box header">Header / Banner</div>
  <div class="box">Intro Text Area</div>

  <div class="three-col">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

  <div class="box">Footer</div>
</div>

<!-- ===== LAYOUT 3 ===== -->
<div class="container">
  <div class="box">Logo</div>

  <div class="two-col">
    <div class="box">Side bar<br>Navigation</div>
    <div>
      <div class="box header">Header / Banner</div>
      <div class="box body">Body Area</div>
    </div>
  </div>

  <div class="box">Footer</div>
</div>

<!-- ===== LAYOUT 4 ===== -->
<div class="container">
  <div class="top">
    <div class="box">Logo</div>
    <div class="box">Navigation</div>
  </div>

  <div class="grid-boxes">
    <div class="box"></div><div class="box"></div><div class="box"></div>
    <div class="box"></div><div class="box"></div><div class="box"></div>
    <div class="box"></div><div class="box"></div><div class="box"></div>
  </div>

  <div class="three-col">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

  <div class="box">Footer</div>
</div>

</body>
</html>
