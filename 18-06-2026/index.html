<!-- Create a user search application using React Hooks, API fetching, JavaScript filtering, and CSS cards. -->

<!-- how output works:-The application displays users in card format and filters 
the cards instantly based on the text entered in the search box. -->

<!DOCTYPE html>
<html>
<head>
  <title>User Search Application</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .container{
      max-width:600px;
      margin:auto;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:20px;
      box-sizing:border-box;
    }

    /* CSS Cards */
    .card{
      background:white;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      box-shadow:0px 0px 5px gray;
    }

  </style>

</head>

<body>

  <main class="container">

    <h1>User Search Application</h1>

    <input
      type="text"
      id="search"
      placeholder="Search User"
      onkeyup="searchUser()"
    >

    <section id="users">

    </section>

  </main>

  <script>

    // User Data
    let users = [];

    // API Fetching
    async function getUsers(){

      let response =
      await fetch(
      "https://jsonplaceholder.typicode.com/users"
      );

      users =
      await response.json();

      displayUsers(users);

    }

    // Display Users
    function displayUsers(data){

      let usersDiv =
      document.getElementById(
      "users"
      );

      usersDiv.innerHTML = "";

      data.forEach(function(user){

        usersDiv.innerHTML += `

        <article class="card">

          <h3>${user.name}</h3>

          <p>${user.email}</p>

        </article>

        `;

      });

    }

    // Search User
    function searchUser(){

      let value =
      document.getElementById(
      "search"
      ).value.toLowerCase();

      // JavaScript Filtering
      let filteredUsers =
      users.filter(function(user){

        return user.name
        .toLowerCase()
        .includes(value);

      });

      displayUsers(filteredUsers);

    }

    // Initial Load
    getUsers();

  </script>

</body>
</html>
