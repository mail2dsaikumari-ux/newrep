<!-- Create a responsive pricing table using React components, CSS Grid, semantic HTML, and conditional rendering. -->

<!-- Create a pricing table that displays different plans such as Basic, Standard, and Premium.
Users can compare plan prices and features. Conditional rendering is used to show special labels like "Most Popular". -->

<!DOCTYPE html>
<html>
<head>
  <title>Course Pricing Table</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
      padding:20px;
    }

    h1{
      text-align:center;
      color:blue;
    }

    /* CSS Grid */

    .pricing-container{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
      margin-top:30px;
    }

    /* Card */

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      text-align:center;
      box-shadow:0px 0px 10px gray;
    }

    .price{
      font-size:25px;
      color:green;
      font-weight:bold;
    }

    .duration{
      color:gray;
      font-weight:bold;
    }

    .popular{
      background:orange;
      color:white;
      padding:5px 10px;
      border-radius:5px;
      display:inline-block;
      margin-bottom:10px;
    }

    button{
      padding:10px 20px;
      border:none;
      background:blue;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    ul{
      list-style:none;
      padding:0;
    }

    li{
      margin:10px 0;
    }

  </style>

</head>

<body>

  <main>

    <h1>Course Pricing Plans</h1>

    <section
    class="pricing-container"
    id="pricing">

    </section>

  </main>

  <script>

    let plans = [

      {
        name:"HTML + CSS Course",
        price:"Rs 8,000 - Rs 10,000",
        duration:"1 - 2 Months",
        popular:false,
        features:[
          "HTML",
          "CSS",
        ]
      },

      {
        name:"JavaScript Course",
        price:"Rs 12,000 - Rs 15,000",
        duration:"2 - 3 Months",
        popular:true,
        features:[
         "HTML",
        "CSS",
         "JavaScript"
        ]
      },

      {
        name:"React JS Course",
        price:"Rs 18,000 - Rs 25,000",
        duration:"3 - 4 Months",
        popular:false,
        features:[
          "HTML",
          "CSS",
          "JavaScript",
          "React"
      ]
      }

    ];

    let pricing =
    document.getElementById(
    "pricing"
    );

    plans.forEach(function(plan){

      pricing.innerHTML += `

      <article class="card">

        ${
          plan.popular
          ?
          '<div class="popular">Most Popular</div>'
          :
          ''
        }

        <h2>${plan.name}</h2>

        <p class="price">
          ${plan.price}
        </p>

        <p class="duration">
          Duration:
          ${plan.duration}
        </p>

        <ul>

          ${plan.features.map(
          function(feature){

            return `
            <li>
            ✔ ${feature}
            </li>
            `;

          }).join("")}

        </ul>

        <button>

          Enroll Now

        </button>

      </article>

      `;

    });

  </script>

</body>
</html>
