<!-- Build a user profile editor using React state, form handling, CSS Flexbox, and JavaScript event handling. -->

<!-- User Profile Editor is a form-based application where users can enter and update profile information. The entered data is
displayed dynamically using JavaScript event handling and DOM manipulation, while React uses state management for updating the UI. -->


<!DOCTYPE html>
<html>
<head>
  <title>User Profile Editor</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;

      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Flexbox */
    .container{
      background:white;
      width:400px;
      padding:20px;
      border-radius:10px;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      text-align:center;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      box-sizing:border-box;
    }

    button{
      margin-top:15px;
      padding:10px 20px;
      background:blue;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .profile{
      margin-top:20px;
      background:#f9f9f9;
      padding:15px;
      border-radius:10px;
    }

  </style>

</head>

<body>

  <main class="container">
    <!-- Creates the main box that contains
the entire profile editor. -->

    <h1>User Profile Editor</h1>

    <!-- Form -->

    <input
      type="text"
      id="name"
      placeholder="Enter Name"
    >
    <!-- Allows user to enter name. -->

    <input
      type="email"
      id="email"
      placeholder="Enter Email"
    >
    <!-- Allows user to enter email. -->

    <input
      type="text"
      id="role"
      placeholder="Enter Role"
    >
    <!-- Allows user to enter role/job.  -->

    <button onclick="updateProfile()">
    <!-- When button is clicked,
        updateProfile() function runs. -->

      Update Profile

    </button>

    <!-- Profile Display -->

    <section
      class="profile"
      id="profile">
    <!-- Displays profile information. -->
      <h3>Name : -</h3>

      <h3>Email : -</h3>

      <h3>Role : -</h3>

    </section>

  </main>

  <script>

    // Update Profile

    function updateProfile(){

      let name =
      document.getElementById(
      "name"
      ).value;

      let email =
      document.getElementById(
      "email"
      ).value;

      let role =
      document.getElementById(
      "role"
      ).value;

      document.getElementById(
      "profile"
      ).innerHTML = `
        <h3>
          Name : ${name}
        </h3>

        <h3>
          Email : ${email}
        </h3>

        <h3>
          Role : ${role}
        </h3>

      `;

    }

  </script>

</body>
</html>
