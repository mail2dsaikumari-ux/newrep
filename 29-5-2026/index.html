<!-- Build a user registration form using React Hooks, JavaScript validation, CSS Grid, and semantic HTML tags. -->

<!DOCTYPE html>
<html>
<head>
  <title>User Registration Form</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f2f2f2;
    }

    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Form Box */
    .box{
      background:white;
      padding:30px;
      border-radius:10px;
      width:400px;
      box-shadow:0px 0px 10px gray;
    }

    h1{
      text-align:center;
    }

    /* CSS Grid */
    .form-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:15px;
    }

    input{
      padding:10px;
    }

    button{
      padding:10px;
      background:blue;
      color:white;
      border:none;
      cursor:pointer;
    }

    #result{
      margin-top:15px;
      color:green;
      text-align:center;
    }

  </style>

</head>

<body>

  <!-- Semantic HTML -->
  <main class="container">

    <section class="box">

      <h1>Registration Form</h1>

      <form class="form-grid">

        <input
          type="text"
          id="name"
          placeholder="Enter Name"
        >

        <input
          type="email"
          id="email"
          placeholder="Enter Email"
        >

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
        >

        <button
          type="button"
          onclick="registerUser()">

          Register

        </button>

      </form>

      <article id="result">

      </article>

    </section>

  </main>

  <script>

    // Register Function
    function registerUser(){

      let name =
      document.getElementById("name").value;

      let email =
      document.getElementById("email").value;

      let password =
      document.getElementById("password").value;

      // Validation
      if(
        name === "" ||
        email === "" ||
        password === ""
      ){

        document.getElementById("result")
        .innerText =
        "Please Fill All Fields";

        return;
      }

      document.getElementById("result")
      .innerText =
      "Registration Successful";

    }

  </script>

</body>
</html>
