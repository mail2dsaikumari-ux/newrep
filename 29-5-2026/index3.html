<!-- Build a student management system using React CRUD operations, JavaScript objects, and CSS Grid layout. -->

<!DOCTYPE html>
<html>
<head>
  <title>Student Management</title>

  <style>

    body{
      font-family:Arial;
      background:#f2f2f2;
      padding:20px;
    }

    .container{
      max-width:700px;
      margin:auto;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      box-sizing:border-box;
    }

    button{
      padding:10px;
      margin-top:10px;
      background:blue;
      color:white;
      border:none;
    }

    /* Grid Layout */
    .students{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(200px,1fr));

      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0px 0px 5px gray;
    }

  </style>

</head>

<body>

  <main class="container">

    <h1>Student Management System</h1>

    <input
      type="text"
      id="name"
      placeholder="Student Name"
    >

    <input
      type="text"
      id="course"
      placeholder="Course"
    >

    <button onclick="addStudent()">

      Add Student

    </button>

    <section
      class="students"
      id="students">

    </section>

  </main>

  <script>

    let students = [];

    // Add Student
    function addStudent(){

      let name =
      document.getElementById("name").value;

      let course =
      document.getElementById("course").value;

      students.push({

        name,
        course

      });

      showStudents();

    }

    // Display Students
    function showStudents(){

      let div =
      document.getElementById("students");

      div.innerHTML = "";

      students.forEach(function(student){

        div.innerHTML += `

          <article class="card">

            <h3>${student.name}</h3>

            <p>${student.course}</p>

          </article>

        `;

      });

    }

  </script>

</body>
</html>
