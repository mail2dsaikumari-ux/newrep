<!-- Build a star rating system using React state, JavaScript events, CSS hover effects, and semantic HTML. -->

<!DOCTYPE html>
<html>
<head>
<title>Star Rating</title>

<style>

body{
  font-family:Arial;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
  box-shadow:0px 0px 10px gray;
}

.star{
  font-size:40px;
  cursor:pointer;
  color:gray;
}

.star:hover{
  color:gold;
}

.active{
  color:gold;
}

</style>
</head>

<body>

<main class="container">

<h1>Star Rating System</h1>

<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>

<h2 id="result">
Rating : 0
</h2>

</main>

<script>

function rate(value){

  let stars =
  document.querySelectorAll(".star");

  stars.forEach(function(star){

    star.classList.remove("active");

  });

  for(let i=0;i<value;i++){

    stars[i].classList.add(
    "active"
    );

  }

  document.getElementById("result")
  .innerText =
  "Rating : " + value;

}

</script>

</body>
</html>
