<!-- Create a progress bar using React Hooks, JavaScript timers, and CSS transitions. -->

<!DOCTYPE html>
<html>
<head>
<title>Progress Bar with Start & Pause</title>

<style>

body{
  font-family:Arial;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  width:500px;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0px 0px 10px gray;
}

.progress-box{
  width:100%;
  height:30px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  background:green;
  transition:0.3s;
}

button{
  margin-top:20px;
  padding:10px 20px;
  background:blue;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-right:10px;
}

</style>
</head>

<body>

<main class="container">

  <h1>Progress Bar</h1>

  <div class="progress-box">

    <div
    class="progress"
    id="progress">

    </div>

  </div>

  <h2 id="percent">

    0%

  </h2>

  <button onclick="startProgress()">

    Start

  </button>

  <button onclick="pauseProgress()">

    Pause

  </button>

</main>

<script>

  // Progress Value
  let width = 0;

  // Timer Variable
  let timer;

  // Start Progress
  function startProgress(){

    clearInterval(timer);

    let bar =
    document.getElementById(
    "progress"
    );

    let percent =
    document.getElementById(
    "percent"
    );

    timer =
    setInterval(function(){

      if(width >= 100){

        clearInterval(timer);

      }

      else{

        width++;

        bar.style.width =
        width + "%";

        percent.innerText =
        width + "%";

      }

    },50);

  }

  // Pause Progress
  function pauseProgress(){

    clearInterval(timer);

  }

</script>

</body>
</html>
